<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2563eb" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <meta name="robots" content="noindex, follow" />
  <title>Dashboard Siswa — SNBT Learning Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .dashboard{padding:48px 0 72px;min-height:70vh}
    .welcome{background:linear-gradient(120deg,#eff6ff,#f8fafc);border:1px solid #dbeafe;border-radius:22px;padding:30px;margin-bottom:24px}
    .welcome h1{margin:0 0 8px;color:#14213d;font-size:clamp(24px,4vw,34px)}
    .welcome p{margin:0;color:#64748b}
    .dash-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
    .stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:24px}
    .stat-card,.panel{background:#fff;border:1px solid #e5eaf2;border-radius:18px;padding:22px}
    .stat-card span{display:block;color:#64748b;font-size:13px}
    .stat-card strong{display:block;color:#1d4ed8;font-size:30px;margin-top:6px}
    .panel h2{font-size:20px;margin:0 0 18px;color:#14213d}
    .activity-item{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 0;border-bottom:1px solid #eef2f7}
    .activity-item:last-child{border-bottom:0}
    .activity-item strong,.activity-item span{display:block}
    .activity-item span{font-size:12px;color:#64748b;margin-top:5px}
    .activity-score{font-weight:800;color:#1d4ed8;white-space:nowrap}
    .empty-state{text-align:center;padding:30px 12px;color:#64748b}
    .empty-state strong{color:#1e293b}
    .empty-state p{line-height:1.6}
    #dashboardStatus{color:#64748b;font-size:13px;margin:12px 0 0}
    @media(max-width:520px){.stats{grid-template-columns:1fr}.welcome{padding:22px}}
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Lewati ke konten utama</a>
  <header class="header"><div class="container header__inner">
    <a href="index.html" class="brand"><span class="brand__logo">SN</span><span class="brand__name">SNBT <span class="brand__accent">Learning Center</span></span></a>
    <button id="signOut" class="btn btn--ghost" type="button">Keluar</button>
  </div></header>
  <main class="dashboard" id="main"><div class="container">
    <section class="welcome">
      <span class="badge">Dashboard Siswa</span>
      <h1>Halo, <span id="studentName">Siswa</span>!</h1>
      <p id="studentEmail">Memuat akun…</p>
      <div class="dash-actions"><a href="materi.html" class="btn btn--primary">Lanjutkan Belajar</a><a href="index.html" class="btn btn--ghost">Beranda</a></div>
    </section>
    <section class="stats" aria-label="Ringkasan progres">
      <article class="stat-card"><span>Aktivitas tersimpan</span><strong id="activityCount">0</strong></article>
      <article class="stat-card"><span>Rata-rata nilai</span><strong id="averageScore">—</strong></article>
    </section>
    <section class="panel">
      <h2>Riwayat Belajar</h2>
      <div id="progressList"><p>Memuat riwayat belajar…</p></div>
      <p id="dashboardStatus" role="status" aria-live="polite"></p>
    </section>
  </div></main>
  <script type="module" src="js/dashboard.js"></script>
  <script src="js/main.js" defer></script>
</body>
</html>
