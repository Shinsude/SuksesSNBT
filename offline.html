<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2563eb" />
  <meta name="robots" content="noindex, follow" />
  <title>Tidak Ada Koneksi — SNBT Learning Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .offline {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 40px 0;
      text-align: center;
    }
    .offline__icon {
      font-size: 64px;
      line-height: 1;
      margin-bottom: 18px;
    }
    .offline h1 {
      font-size: clamp(1.6rem, 4vw, 2.2rem);
      font-weight: 800;
      margin-bottom: 10px;
    }
    .offline p {
      color: var(--muted);
      max-width: 460px;
      margin: 0 auto 26px;
    }
    .offline__actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Lewati ke konten utama</a>
  <main id="main" class="offline">
    <div class="container">
      <div class="offline__icon" aria-hidden="true">📡</div>
      <h1>Kamu Sedang Offline</h1>
      <p>
        Koneksi internet tidak tersedia. Halaman yang sudah pernah kamu buka masih bisa
        diakses. Coba lagi setelah koneksi kembali.
      </p>
      <div class="offline__actions">
        <a href="index.html" class="btn btn--primary">Ke Beranda</a>
        <a href="materi.html" class="btn btn--ghost">Daftar Materi</a>
      </div>
    </div>
  </main>
</body>
</html>
