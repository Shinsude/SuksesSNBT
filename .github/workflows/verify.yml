name: Verify SuksesSNBT
on:
  push:
    branches:
      - integrasi-snbt-learning-center-2026-11
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check internal links, manifest and PWA assets
        run: python3 scripts/verify_site.py
      - name: Validate Android TWA configuration
        run: python3 scripts/verify_android_config.py
      - name: Check JavaScript syntax
        run: |
          find js data scripts -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Validate SNBT question bank and packages
        run: node scripts/verify_content.js
      - name: Smoke-test tryout and subtest package interactions
        run: node scripts/verify_interactions.js
